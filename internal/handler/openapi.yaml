openapi: 3.0.3

info:
  title: Ticket Reservation API
  version: 0.3.0
  description: |
    Seat reservation with temporary holds.

    A seat is claimed with a hold that expires after five minutes. Only the user
    holding a seat may confirm or release it, and a hold that has run out frees
    the seat immediately, whether or not the background sweeper has noticed yet.

    **Live updates**: `GET /events/{eventID}/stream` keeps a connection open and
    pushes a notice whenever a seat changes, so a client does not have to poll.

    **Limits**: every caller has an allowance. Signing in is limited far more
    tightly than reading, because each attempt costs a password hash. A refusal is
    a 429 carrying `Retry-After`.

    **Retries**: every write endpoint accepts an `Idempotency-Key` header. A
    repeated request carrying the same key gets the first attempt's answer back,
    marked with `Idempotent-Replay: true`, rather than being executed twice.

    **Identity**: writing endpoints need a bearer token; reading ones do not. The
    caller is whoever the token names, so a client can no longer act as anyone it
    likes by asserting a header.

servers:
  - url: /
    description: The server this page was loaded from

security:
  - BearerToken: []

tags:
  - name: accounts
    description: Registering and signing in
  - name: events
    description: Events and their seat maps
  - name: holds
    description: Claiming, confirming and releasing seats
  - name: waiting list
    description: Queueing for a seat that is not free yet
  - name: admin
    description: Stocking the service with events and seats
  - name: notifications
    description: What the service still has to tell the caller
  - name: push
    description: Letting a browser be pushed to
  - name: system
    description: Operational endpoints

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness check
      description: |
        Answers without touching anything the service depends on. This is what an
        orchestrator restarts the process over, and restarting a working process
        because a database is down helps nobody.
      security: []
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /ready:
    get:
      tags: [system]
      summary: Readiness check
      description: |
        Whether traffic should be sent to this instance right now. With a
        database configured it is reached with a short deadline; with the
        in-memory stores there is nothing to reach and the answer is always
        ready.

        This is what a load balancer takes an instance out of rotation over. The
        split from `/health` is deliberate: an outage should stop traffic, not
        start a restart loop that cannot fix it and loses every in-flight request
        on the way.
      security: []
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A dependency could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: unavailable
                store: postgres
                err: the database could not be reached

  /metrics:
    get:
      tags: [system]
      summary: Prometheus metrics
      description: |
        The scrape endpoint. Route labels carry the matched pattern rather than
        the path, so a hold id never becomes a time series of its own.

        Open here, like `/health`. A real deployment would put it on an address
        the internet cannot reach: it says a good deal about what the process is
        doing and how much of it there is.
      security: []
      responses:
        "200":
          description: The current values, in the Prometheus text format
          content:
            text/plain:
              schema:
                type: string
              example: |
                http_requests_total{method="POST",route="POST /events/{eventID}/seats/{seatID}/hold",status="409"} 1
                api_failures_total{code="seat_not_available"} 1
                stream_subscribers 1

  /auth/register:
    post:
      tags: [accounts]
      summary: Create an account
      description: |
        The address is stored lowered and trimmed, so signing up as Dilara@x.com
        and signing in as dilara@x.com reach the same account.

        Passwords are between 8 characters and 72 bytes. The upper bound is not
        arbitrary: bcrypt reads only the first 72 bytes, and accepting a longer
        password would silently ignore the rest of it.

        No token comes back. Signing in is a separate call.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The address already belongs to an account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: email_taken
                  message: that email address is already registered
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [accounts]
      summary: Sign in and get a token
      description: |
        Returns a bearer token for the account. Send it as
        `Authorization: Bearer <token>` on the writing endpoints.

        A wrong password and an unknown address give the same answer, and take a
        comparable amount of time, so that this endpoint cannot be used to find
        out which addresses are registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The address or the password is wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_credentials
                  message: the email address or password is wrong
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/verify:
    post:
      tags: [accounts]
      summary: Confirm an email address
      description: |
        Follows the link sent on registration. The token works once and stops
        working after a day.

        A POST rather than a GET on the link itself, because a mailbox scanner
        or a link preview fetching a GET would spend a single-use token before
        the person ever clicked it. The page behind the link reads the token out
        of the query string and sends it here.

        Until an address is confirmed nothing is emailed to it. Anybody can
        register with somebody else's address, and sending to it would make this
        service a way to post mail to strangers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: The address is confirmed
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          description: |
            Unknown, already spent, or expired. One answer for all three:
            telling them apart would say whether a token was ever real.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: verification_not_usable
                  message: that verification link is no longer valid
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/verify/resend:
    post:
      tags: [accounts]
      summary: Send the confirmation link again
      description: |
        Needs a token, so it can only ask for the caller's own address. An
        endpoint that took an address would send mail to anybody who was named.

        Earlier links are left working: somebody who clicks the first message
        after asking for a second should not be told their link is broken.

        Answers 202 rather than 204, because the message is queued rather than
        already gone.
      responses:
        "202":
          description: A fresh link has been queued
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The address is already confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: already_verified
                  message: the address is already verified
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [accounts]
      summary: Sign out
      description: |
        Refuses the caller's own token for whatever is left of its life.

        It takes no body and names no token: the one being signed out is the one
        the request arrived with. A caller that could name a token could sign out
        somebody else's.

        Only that token is affected. Signing in twice gives two tokens, and this
        ends one of them, which is what makes signing out of one device possible.
        The record is kept only until the token would have expired anyway.
      responses:
        "204":
          description: The token will no longer be accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          description: |
            This deployment has nothing wired in to remember a signed out token.
            Not a failure: the service would otherwise be reporting that it had
            done something it cannot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: logout_unavailable
                  message: signing out is not available

  /events:
    get:
      tags: [events]
      summary: List events
      description: Events are returned soonest first. An empty catalogue is `[]`, never `null`.
      security: []
      responses:
        "200":
          description: The events on sale
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /events/{eventID}:
    get:
      tags: [events]
      summary: Get one event
      description: |
        Everything the detail page shows, including how many seats are still
        open. The counts are made here rather than left to the caller, because
        counting from outside means fetching every seat in the hall.
      security: []
      parameters:
        - $ref: "#/components/parameters/EventID"
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events/{eventID}/seats:
    get:
      tags: [events]
      summary: Get the seat map of an event
      description: |
        Seats are ordered by row and then number. A seat whose hold has expired is
        reported as `available` even if the sweeper has not cleaned it up yet, and
        the identity of whoever holds a seat is never exposed here.
      security: []
      parameters:
        - $ref: "#/components/parameters/EventID"
      responses:
        "200":
          description: The seat map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatMap"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events/{eventID}/stream:
    get:
      tags: [events]
      summary: Watch an event for changes
      description: |
        A server-sent event stream that stays open and pushes a notice whenever
        something changes, so a client does not have to keep asking.

        Each notice says *what* changed rather than what it changed to, so the
        client fetches the seat map when it hears one. That keeps a notice from
        going stale in flight and from carrying more than the seat map endpoint
        would.

        Kinds sent:

        - `seat_changed` — a seat's status is no longer what you last saw. Public,
          so every watcher of the event gets it.
        - `event_cancelled` — this event has been withdrawn from sale. Public,
          so every watcher gets it; the people who hold tickets also get a stored
          notice they will find whenever they next look.
        - `turn_came` — a seat you were waiting for is now held for you. It
          carries the `holdId` and the `expiresAt` of the hold that was made, so
          the client can confirm it without asking. Sent only to the caller it
          concerns, so this stream has to be opened with a token; `EventSource`
          cannot send one, which is why the bundled page reads it with `fetch`.

        Comment lines are sent every 25 seconds to keep proxies from closing an
        idle connection. Browsers reconnect on their own when it drops.
      security: []
      parameters:
        - $ref: "#/components/parameters/EventID"
      responses:
        "200":
          description: The stream is open
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: seat_changed
                data: {"kind":"seat_changed","eventId":"event-1","seatId":"A1","at":"2026-08-18T12:00:00Z"}
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: The server cannot hold a connection open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: stream_unavailable
                  message: live updates are not available

  /admin/events:
    post:
      tags: [admin]
      summary: Create an event
      description: |
        Requires an administrator. The role is read from storage on every
        request rather than carried in the token, so taking it away takes effect
        at once.

        The id is assigned here rather than taken from the caller, so two people
        stocking the service at the same time cannot collide over a name they
        both thought was free. It comes back in the body and in `Location`.

        There is no endpoint that makes an administrator. The first one is made
        with the `admin` command, which needs database access — an endpoint that
        can create an administrator is an endpoint that can be talked into
        creating one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEvent"
      responses:
        "201":
          description: The event, with the id it was given
          headers:
            Location:
              schema:
                type: string
              description: Where the new event can be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: An event with that id already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: event_exists
                  message: an event with that id already exists
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /admin/events/{eventID}:
    patch:
      tags: [admin]
      summary: Change an event
      description: |
        Every field is optional: a caller fixing a typo in the venue should not
        have to repeat the name and the start time, and repeating them is how one
        of them gets sent back stale.

        A cancelled event cannot be edited. It is a record of something that is
        not happening, and editing it would quietly turn it into a different one.
      parameters:
        - $ref: "#/components/parameters/EventID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventChanges"
      responses:
        "200":
          description: The event as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The event is cancelled, so it is no longer editable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: event_already_cancelled
                  message: the event is already cancelled

    delete:
      tags: [admin]
      summary: Remove an event outright
      description: |
        Refused while any of the event's seats is held or sold. Removing a
        mistake is one thing; removing something people have tickets to is
        another, and cancelling is what that is for.

        The check and the delete are one statement, so a seat that stops being
        available in between cannot slip through.
      parameters:
        - $ref: "#/components/parameters/EventID"
      responses:
        "204":
          description: The event is gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Seats of this event are held or sold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: event_in_use
                  message: the event has seats that are held or sold

  /admin/events/{eventID}/cancel:
    post:
      tags: [admin]
      summary: Withdraw an event from sale
      description: |
        Marks the event rather than removing it, so the people holding tickets to
        it can still see what happened. It stays in the catalogue with
        `cancelled: true`.

        No new seats may be claimed afterwards. Anyone who already holds one may
        still confirm it: they were part way through a purchase when this
        happened, and taking it away from them is a worse answer than letting
        them finish.

        Takes no body. There is one thing to say and the path says which event.
      parameters:
        - $ref: "#/components/parameters/EventID"
      responses:
        "200":
          description: The event, now withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: It was already withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: event_already_cancelled
                  message: the event is already cancelled

  /admin/events/{eventID}/seats:
    post:
      tags: [admin]
      summary: Add rows of seats to an event
      description: |
        Requires an administrator. Builds the given rows, each numbered from one
        to `seatsPerRow`, so `rows: ["A","B"]` with `seatsPerRow: 3` makes A1, A2,
        A3, B1, B2 and B3.

        Seats that already exist are left alone, so adding a row twice does not
        disturb one that is already held or sold. At most 2000 seats in one
        request: without a limit one mistyped number becomes millions of rows.
      parameters:
        - $ref: "#/components/parameters/EventID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSeats"
      responses:
        "201":
          description: How many seats were built
          content:
            application/json:
              schema:
                type: object
                required: [eventId, created]
                properties:
                  eventId:
                    type: string
                    example: event-1
                  created:
                    type: integer
                    example: 20
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events/{eventID}/waiting-list:
    get:
      tags: [waiting list]
      summary: Where the caller stands in the queue
      parameters:
        - $ref: "#/components/parameters/EventID"
      responses:
        "200":
          description: The caller's place
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingListPlace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The caller is not in this queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_waiting
                  message: the user is not on the waiting list
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      tags: [waiting list]
      summary: Take a place in the queue
      description: |
        Needs a confirmed email address, the same as holding a seat does. The
        rule has to be the same in both places: somebody who cannot be given a
        seat would otherwise reach the front of the queue, be refused, and be
        put back, blocking everybody behind them.

        When a seat of this event comes free, whoever has waited longest is given
        a hold on it automatically and told over the stream with a `turn_came`
        notice. That hold is an ordinary one: it runs out like any other, and the
        seat then goes to the next person.

        Joining a queue the caller is already in is not an error and does not
        cost them the time they have already waited, so this answers 200 rather
        than 201.
      parameters:
        - $ref: "#/components/parameters/EventID"
      responses:
        "200":
          description: The caller's place in the queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitingListPlace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      tags: [waiting list]
      summary: Give up the caller's place
      description: |
        Answers 204 whether or not the caller was in the queue, since either way
        they are out of it now.
      parameters:
        - $ref: "#/components/parameters/EventID"
      responses:
        "204":
          description: The caller is not in the queue
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events/{eventID}/seats/{seatID}/hold:
    post:
      tags: [holds]
      summary: Hold a seat
      description: |
        Claims the seat for the caller for five minutes. Out of any number of
        simultaneous claims on one seat, exactly one succeeds; the others get 409.
      parameters:
        - $ref: "#/components/parameters/EventID"
        - $ref: "#/components/parameters/SeatID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The seat is held
          headers:
            Location:
              description: Where the new hold can be addressed
              schema:
                type: string
                example: /holds/MISGMDTLRSNOFSQWK7APCS3FAZ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The seat is already held by a live hold or already reserved
            (`seat_not_available`), or an earlier request with the same
            Idempotency-Key is still running (`idempotency_in_progress`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: seat_not_available
                  message: seat is not available
        "422":
          $ref: "#/components/responses/KeyReused"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notifications:
    get:
      tags: [notifications]
      summary: What the caller has not been told yet
      description: |
        The caller's notices, newest first, read and unread together. `unread` is
        given separately so a page can show a count without walking the list,
        which is the one thing it needs before anybody opens it.

        Stored rather than only pushed down the stream, because the point of
        being told is that you were not looking: a notice that only reaches
        people who happen to have the page open is not a notification. The event
        name is carried in each notice, since the event may have been removed by
        the time anyone reads it.
      responses:
        "200":
          description: The caller's notices
          content:
            application/json:
              schema:
                type: object
                required: [unread, notifications]
                properties:
                  unread:
                    type: integer
                    example: 1
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notifications/read:
    post:
      tags: [notifications]
      summary: Mark everything as read
      description: |
        Marks all of the caller's unread notices and reports how many that was.
        All of them rather than one at a time, because that is what opening the
        list means.

        Takes no body and names no notice: it marks the caller's own, and a
        caller that could name one could mark somebody else's.
      responses:
        "200":
          description: How many were marked
          content:
            application/json:
              schema:
                type: object
                required: [markedRead]
                properties:
                  markedRead:
                    type: integer
                    example: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /push/key:
    get:
      tags: [push]
      summary: The public VAPID key
      description: |
        What a browser needs before it can ask anybody for permission. Open,
        because the key is public by definition.

        These routes only exist when the deployment has a VAPID pair. Offering a
        subscription that could never be pushed to would be a button that does
        nothing.
      security: []
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey:
                    type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /push/subscriptions:
    post:
      tags: [push]
      summary: Let this browser be pushed to
      description: |
        Takes what the browser's `PushSubscription` serialises to, so the client
        can send what it was given rather than taking it apart first.

        One subscription per browser, not per person: somebody with a phone and
        a laptop has two, and allowing notifications on one says nothing about
        the other. The same browser subscribing again replaces its keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscription"
      responses:
        "204":
          description: This browser will be pushed to
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      tags: [push]
      summary: Stop pushing to this browser
      description: |
        Names the endpoint in the body, because a person has one per browser and
        this is the one saying stop.

        Only the caller's own. An endpoint is long and unguessable but it is not
        a secret, and without the check anybody holding one could switch
        somebody else's notifications off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
      responses:
        "204":
          description: This browser will not be pushed to
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: That subscription belongs to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_your_subscription
                  message: that subscription belongs to another account
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /account:
    get:
      tags: [accounts]
      summary: Who the caller is
      description: |
        What the interface needs to decide which parts of itself to show: whether
        to offer the administrative section, and whether to ask for the address
        to be confirmed. Being refused is a poor way to find either out.
      responses:
        "200":
          description: The caller's account
          content:
            application/json:
              schema:
                type: object
                required: [userId, email, role, emailVerified]
                properties:
                  userId:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum: [customer, admin]
                  emailVerified:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /tickets/{ticketCode}/qr.png:
    get:
      tags: [holds]
      summary: The ticket as a scannable image
      description: |
        Rendered here rather than in the browser, because encoding a QR is error
        correction and bit placement, and a page that gets it subtly wrong
        produces a code that scans everywhere except at the door.

        Only the caller's own. A code belonging to somebody else answers 404
        rather than their ticket, and the same answer covers a code that does not
        exist — otherwise this would be a way to check whether one is real.
      parameters:
        - name: ticketCode
          in: path
          required: true
          schema:
            type: string
          example: SH-7K2Q-94XD
      responses:
        "200":
          description: The image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such ticket of the caller's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ticket_not_found
                  message: no such ticket

  /tickets:
    get:
      tags: [holds]
      summary: What the caller is holding and has reserved
      description: |
        Everything this caller has, across every event: the seats held right now
        and the ones already confirmed, kept apart because they are different
        things to read — one is a countdown, the other is a ticket.

        The seat map never says who holds or owns a seat, so without this a
        confirmed seat is invisible to the person who owns it. It is also how a
        page reloaded mid hold recovers: the hold id and the time left come back
        here, and the seat can be confirmed without starting again.

        A hold that has run out is left out even if the sweeper has not been
        round yet, because showing it would promise a seat that is already free.
      responses:
        "200":
          description: The caller's seats
          content:
            application/json:
              schema:
                type: object
                required: [holds, reservations]
                properties:
                  holds:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ticket"
                  reservations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ticket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /holds/{holdID}/confirm:
    post:
      tags: [holds]
      summary: Confirm a hold into a reservation
      description: |
        Only the user holding the seat may confirm it, and only before the hold
        runs out.

        Confirming clears the hold, so a bare retry would report 404: the hold it
        names no longer exists. Send an `Idempotency-Key` and the retry gets this
        answer back instead.
      parameters:
        - $ref: "#/components/parameters/HoldID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The seat is reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The seat is not held, so there is nothing to confirm
            (`seat_not_held`), or an earlier request with the same
            Idempotency-Key is still running (`idempotency_in_progress`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: seat_not_held
                  message: seat is not held
        "410":
          description: |
            The hold existed but has expired. This is distinct from 409: the
            caller was simply too late, and starting over may well succeed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: hold_expired
                  message: hold has expired
        "422":
          $ref: "#/components/responses/KeyReused"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /holds/{holdID}:
    delete:
      tags: [holds]
      summary: Release a hold
      description: Frees the seat straight away instead of waiting for the hold to expire.
      parameters:
        - $ref: "#/components/parameters/HoldID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The hold is gone and the seat is available again
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An earlier request with the same Idempotency-Key is still running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: idempotency_in_progress
                  message: a request with this idempotency key is still in progress
        "422":
          $ref: "#/components/responses/KeyReused"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      description: |
        A signed token naming the caller, sent as `Authorization: Bearer <token>`.

        The payload is signed, not encrypted: anyone holding a token can read the
        user id out of it, but nobody can change it without the signing secret.

        Mint one for local use with `go run ./cmd/token dilara`, then paste it
        into **Authorize** above.

  parameters:
    EventID:
      name: eventID
      in: path
      required: true
      description: Identifier of the event
      schema:
        type: string
      example: event-1

    SeatID:
      name: seatID
      in: path
      required: true
      description: Identifier of the seat within the event
      schema:
        type: string
      example: A1

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes a retry safe. A repeated request carrying the same key returns the
        first attempt's answer instead of doing the work again, and that answer
        carries an `Idempotent-Replay: true` header.

        Without it, a confirm whose response was lost cannot be retried: the
        second attempt reports 404, because the first one consumed the hold.

        Keys are scoped to the caller, so one client cannot reach another's
        answer, and they expire after 24 hours.
      schema:
        type: string
      example: 4f9a2b7c-3d1e-4a6f-9b0c-2e5d8a1f7c33

    HoldID:
      name: holdID
      in: path
      required: true
      description: Identifier returned when the seat was held
      schema:
        type: string
      example: MISGMDTLRSNOFSQWK7APCS3FAZ

  responses:
    BadRequest:
      description: The request is missing something it needs, such as the X-User-ID header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: user_id_required
              message: X-User-ID header is required

    Forbidden:
      description: The hold belongs to another user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_hold_owner
              message: hold belongs to another user

    KeyReused:
      description: |
        The Idempotency-Key was first used for a different request. Replaying the
        other request's answer would be wrong, so it is refused rather than
        guessed at.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: idempotency_key_reused
              message: this idempotency key was already used for a different request

    Unauthorized:
      description: |
        No token was sent (`unauthenticated`), or the one sent was not valid
        (`invalid_token`). The answer never says which part of a token failed, so
        that a caller cannot work its way towards one that passes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: this endpoint requires a bearer token

    BodyTooLarge:
      description: The request body exceeds the 8 KiB limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: request_body_too_large
              message: the request body is too large

    TooManyRequests:
      description: |
        The caller has used up its allowance. Signing in is limited far more
        tightly than reading, because each attempt costs a password hash.

        The `Retry-After` header says how many seconds to wait.
      headers:
        Retry-After:
          description: Seconds to wait before trying again
          schema:
            type: integer
            example: 6
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: too_many_requests
              message: too many requests, slow down

    NotFound:
      description: The event, seat or hold does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: hold_not_found
              message: hold not found

  schemas:
    PushSubscription:
      type: object
      required: [endpoint, keys]
      description: |
        The shape a browser's PushSubscription serialises to. Send it as the
        browser gave it.
      properties:
        endpoint:
          type: string
          description: The URL the browser's push service listens on.
        keys:
          type: object
          required: [p256dh, auth]
          description: |
            The browser's own keys. The payload is encrypted to them, so the push
            service carrying it cannot read it.
          properties:
            p256dh:
              type: string
            auth:
              type: string

    Notification:
      type: object
      required: [id, kind, eventId, eventName, createdAt, read]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [event_cancelled]
          description: A closed set, so a reader never meets a kind nothing is written for.
        eventId:
          type: string
          example: event-1
        eventName:
          type: string
          description: Carried in the notice, because the event may be gone by now.
          example: Radiohead
        seatId:
          type: string
          description: |
            Present when the notice is about one seat. Left out for somebody who
            was on the waiting list rather than holding a seat.
          example: A1
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
          example: false

    Ticket:
      type: object
      required: [eventId, eventName, venue, startsAt, seatId, row, number, status]
      description: |
        A seat the caller has, carrying enough of its event to be shown without a
        second request. The hold fields are present only while the seat is held.
      properties:
        eventId:
          type: string
          example: event-1
        eventName:
          type: string
          example: Radiohead
        venue:
          type: string
          example: Volkswagen Arena
        startsAt:
          type: string
          format: date-time
        seatId:
          type: string
          example: A1
        row:
          type: string
          example: A
        number:
          type: integer
          example: 1
        status:
          $ref: "#/components/schemas/SeatStatus"
        ticketCode:
          type: string
          description: Present once the seat is confirmed. What is shown and scanned at the door.
          example: SH-7K2Q-94XD
        holdId:
          type: string
          description: Present while held. What the confirm endpoint takes.
        expiresAt:
          type: string
          format: date-time
          description: Present while held.
        expiresInSeconds:
          type: integer
          description: Present while held, for the countdown.
          example: 240

    EventDetails:
      type: object
      description: |
        The descriptive half of an event. On an edit these behave differently
        from the fields above: a field left out is kept, and a field sent empty
        is cleared. A description that may legitimately be blank cannot use
        blank to mean "unchanged".
      properties:
        city:
          type: string
          example: Istanbul
        category:
          $ref: "#/components/schemas/Category"
        imageUrl:
          type: string
          description: http or https. Rendered as an image source.
          example: https://images.example.com/radiohead.jpg
        description:
          type: string
        rules:
          type: string

    NewEvent:
      allOf:
        - $ref: "#/components/schemas/EventDetails"
        - type: object
          required: [name, venue, startsAt, city]
          properties:
            name:
              type: string
              example: Radiohead
            venue:
              type: string
              example: Volkswagen Arena
            startsAt:
              type: string
              format: date-time
              description: Stored to the second; anything finer is noise on a start time.
              example: "2026-11-14T20:30:00Z"

    EventChanges:
      description: |
        Every field is optional. A name, venue or start time left out or sent
        empty is left as it was; a descriptive field left out is kept, and one
        sent empty is cleared.
      allOf:
        - $ref: "#/components/schemas/EventDetails"
        - type: object
          properties:
            name:
              type: string
              example: Radiohead
            venue:
              type: string
              example: Volkswagen Arena
            startsAt:
              type: string
              format: date-time
              example: "2026-11-14T21:00:00Z"

    NewSeats:
      type: object
      required: [rows, seatsPerRow]
      properties:
        rows:
          type: array
          items:
            type: string
          description: Row labels. The same label twice is refused, because it would build the same seat twice.
          example: ["A", "B"]
        seatsPerRow:
          type: integer
          minimum: 1
          example: 10

    Readiness:
      type: object
      required: [status, store]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        store:
          type: string
          enum: [memory, postgres]
        err:
          type: string
          description: |
            Why it is not ready, in general terms. Never carries the connection
            string or anything out of it.
          example: the database could not be reached

    WaitingListPlace:
      type: object
      required: [eventId, userId, position]
      properties:
        eventId:
          type: string
          example: event-1
        userId:
          type: string
          example: user-3
        position:
          type: integer
          minimum: 1
          description: Where the caller stands, counting from one.
          example: 2

    Credentials:
      type: object
      required: [email, password]
      description: |
        Unknown fields are refused rather than ignored, so a typo such as
        "passwrod" is reported instead of quietly leaving the password empty.
      properties:
        email:
          type: string
          format: email
          example: dilara@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: a-perfectly-fine-password

    User:
      type: object
      required: [id, email, createdAt]
      description: An account. The password hash is never part of any response.
      properties:
        id:
          type: string
          example: 4f9a2b7c3d1e4a6f
        email:
          type: string
          example: dilara@example.com
        createdAt:
          type: string
          format: date-time

    Session:
      type: object
      required: [token, userId, expiresAt, expiresInSeconds]
      properties:
        token:
          type: string
          description: |
            Send as `Authorization: Bearer <token>`. The payload is signed, not
            encrypted: it can be read, but not changed.
          example: ZGlsYXJhfDE3ODcwNDYwODk.ToxdszNwKcCeItfOx0cQk2Nj4hsM2_-FGA9UtGor1XM
        userId:
          type: string
          example: 4f9a2b7c3d1e4a6f
        expiresAt:
          type: string
          format: date-time
        expiresInSeconds:
          type: integer
          example: 3600

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Event:
      type: object
      required: [id, name, venue, startsAt, hasStarted, cancelled]
      properties:
        id:
          type: string
          example: event-1
        name:
          type: string
          example: Radiohead
        venue:
          type: string
          example: Volkswagen Arena
        startsAt:
          type: string
          format: date-time
        hasStarted:
          type: boolean
          description: Computed at request time from the server's clock
          example: false
        cancelled:
          type: boolean
          description: |
            A withdrawn event stays in the catalogue rather than disappearing, so
            that somebody holding a ticket to it can see what happened.
          example: false
        cancelledAt:
          type: string
          format: date-time
          description: Present only once the event has been withdrawn.
        city:
          type: string
          description: What the catalogue is filtered by.
          example: Istanbul
        category:
          $ref: "#/components/schemas/Category"
        imageUrl:
          type: string
          description: The poster. Empty when the event has none.
          example: https://images.example.com/radiohead.jpg
        description:
          type: string
          example: Touring In Rainbows, with a string section for the second half.
        rules:
          type: string
          example: Doors at 19:00. Under 16s must come with an adult.

    EventDetail:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          required: [available, total]
          properties:
            available:
              type: integer
              description: Seats that can be taken right now, expired holds counted as free.
              example: 53
            total:
              type: integer
              example: 80

    Category:
      type: string
      description: |
        The kind of event, and the catalogue's main filter. A closed set: one
        venue typing "Stand-up" and another "stand up" would otherwise split one
        category into two that each find half the events. An event created
        without one is stored as `other`.
      enum: [concert, theatre, comedy, festival, sport, family, other]
      example: concert

    SeatStatus:
      type: string
      description: |
        Where the seat is in its lifecycle. Defined once here and referenced
        wherever a status appears, so the list cannot drift apart between
        endpoints.
      enum: [available, held, reserved]
      example: available

    Seat:
      type: object
      required: [id, row, number, status]
      properties:
        id:
          type: string
          example: A1
        row:
          type: string
          example: A
        number:
          type: integer
          example: 1
        status:
          $ref: "#/components/schemas/SeatStatus"

    SeatMap:
      type: object
      required: [eventId, seats]
      properties:
        eventId:
          type: string
          example: event-1
        seats:
          type: array
          items:
            $ref: "#/components/schemas/Seat"

    Hold:
      type: object
      required: [holdId, eventId, seatId, userId, expiresAt, expiresInSeconds]
      properties:
        holdId:
          type: string
          example: MISGMDTLRSNOFSQWK7APCS3FAZ
        eventId:
          type: string
          example: event-1
        seatId:
          type: string
          example: A1
        userId:
          type: string
          example: dilara
        expiresAt:
          type: string
          format: date-time
        expiresInSeconds:
          type: integer
          description: |
            Sent alongside expiresAt because the client's own clock may be wrong.
          example: 299

    Reservation:
      type: object
      required: [eventId, seatId, userId, status]
      properties:
        eventId:
          type: string
          example: event-1
        seatId:
          type: string
          example: A1
        userId:
          type: string
          example: dilara
        status:
          # A successful confirm always leaves the seat reserved, but the field is
          # not narrowed to that one value: a single member enum would become a
          # lie the moment cancellation exists.
          $ref: "#/components/schemas/SeatStatus"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable machine readable reason. Branch on this rather than on the
                message, which is prose and may change.
              enum:
                - event_not_found
                - seat_not_found
                - hold_not_found
                - not_waiting
                - ticket_not_found
                - client_closed
                - not_permitted
                - event_exists
                - event_in_use
                - event_cancelled
                - event_already_cancelled
                - invalid_event
                - invalid_seat_map
                - logout_unavailable
                - invalid_push_subscription
                - not_your_subscription
                - verification_not_usable
                - already_verified
                - email_not_verified
                - seat_not_available
                - seat_not_held
                - hold_expired
                - not_hold_owner
                - unauthenticated
                - invalid_token
                - invalid_credentials
                - email_taken
                - invalid_email
                - weak_password
                - invalid_request_body
                - request_body_too_large
                - too_many_requests
                - stream_unavailable
                - idempotency_in_progress
                - idempotency_key_reused
                - user_id_required
                - hold_id_required
                - event_id_required
                - invalid_hold_duration
                - internal_error
            message:
              type: string
              description: Human readable explanation. Never contains internal detail.
