services:
  postgres:
    image: postgres:17-alpine
    container_name: ticket-reservation-db
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: ticket_reservation
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket_reservation"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
